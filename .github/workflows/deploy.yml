name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and restart containers
        run: |
          docker compose down
          docker compose up -d --build

      - name: Clear configuration cache
        run: docker compose exec -T app php artisan config:clear

      - name: Run database migrations
        run: docker compose exec -T app php artisan migrate --force
